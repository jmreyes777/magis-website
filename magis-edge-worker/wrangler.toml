# Cloudflare Worker config — Magis edge worker (STAGING)
# Service-worker format (index.js uses addEventListener("fetch", ...) and
# reads bindings from globalThis: BACKEND_URL, ADMIN_URL, GUEST_URL,
# JWT_SECRET, JWT_PUBLIC_KEY, EDGE_SHARED_SECRET, RATE_LIMIT_KV).
#
# Secrets are NOT stored here. Set them with:
#   wrangler secret put JWT_SECRET
#   wrangler secret put EDGE_SHARED_SECRET
#
# Deploy with:
#   wrangler deploy

name = "magis-edge-worker-staging"
main = "index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Non-secret runtime vars (exposed as globals in service-worker format).
[vars]
BACKEND_URL = "https://magis-website.onrender.com"
# ADMIN_URL / GUEST_URL are only used for non-/api (frontend) routing + CORS.
# Uncomment and set these once the staging frontends are deployed:
# ADMIN_URL = "https://<admin-staging-url>"
# GUEST_URL = "https://<guest-staging-url>"
# P2-3: RSA public key for asymmetric (RS256) JWT verification. The backend
# signs with the matching PRIVATE key; the edge only ever needs this PUBLIC key.
# It is NOT a secret, so a [vars] entry is fine (or use `wrangler secret put
# JWT_PUBLIC_KEY`). Generate with: node backend/scripts/generate-jwt-keypair.js
# Keep JWT_SECRET bound until the HS256→RS256 cutover completes, then REMOVE it
# so the edge accepts RS256 only (a compromised edge can't forge tokens).
# JWT_PUBLIC_KEY = """
# -----BEGIN PUBLIC KEY-----
# <spki-base64-lines>
# -----END PUBLIC KEY-----
# """
# P2-1: edge rate-limit fail-mode when RATE_LIMIT_KV is bound but ERRORS.
# Leave unset/"false" to fail-OPEN (don't take the site down for a KV blip);
# set "true" to fail-CLOSED (block on KV error — stronger, but a KV outage can
# reject legitimate traffic). No effect when RATE_LIMIT_KV is simply unbound.
# RATE_LIMIT_FAIL_CLOSED = "false"

# P2-1: KV namespace for edge rate-limiting. While UNBOUND, edge rate-limiting
# auto-skips (the origin still applies its own Redis-backed limits). To ACTIVATE
# edge limiting:
#   1) wrangler kv namespace create RATE_LIMIT_KV
#   2) copy the printed id into the binding below and uncomment the block
#   3) wrangler deploy
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<kv-namespace-id>"
