# Cloudflare Worker config — Magis edge worker (STAGING)
# Service-worker format (index.js uses addEventListener("fetch", ...) and
# reads bindings from globalThis: BACKEND_URL, ADMIN_URL, GUEST_URL,
# JWT_SECRET, JWT_PUBLIC_KEY, EDGE_SHARED_SECRET, RATE_LIMIT_KV,
# RATE_LIMIT_FAIL_CLOSED, CSP_MODE, JWT_VERIFY_CLAIMS, JWT_ISSUER, JWT_AUD_ADMIN).
#
# Secrets are NOT stored here. Set them with:
#   wrangler secret put JWT_SECRET
#   wrangler secret put EDGE_SHARED_SECRET
#
# Deploy with:
#   wrangler deploy

name = "magis-edge-worker-staging"
main = "index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Non-secret runtime vars (exposed as globals in service-worker format).
[vars]
BACKEND_URL = "https://magis-website.onrender.com"
# ADMIN_URL / GUEST_URL are used for non-/api (frontend) routing + CORS.
# These mirror what the LIVE staging worker serves (verified 2026-07-11):
# /admin* -> staging admin SPA, everything else -> guest SPA (served by the
# backend service). wrangler deploy REPLACES live [vars], so keep these set.
ADMIN_URL = "https://magis-admin-staging.onrender.com"
GUEST_URL = "https://magis-guest-staging.onrender.com"
# P2-3: RSA public key for asymmetric (RS256) JWT verification. The backend
# signs with the matching PRIVATE key; the edge only ever needs this PUBLIC key.
# It is NOT a secret, so a [vars] entry is fine (or use `wrangler secret put
# JWT_PUBLIC_KEY`). Generate with: node backend/scripts/generate-jwt-keypair.js
# Keep JWT_SECRET bound until the HS256→RS256 cutover completes, then REMOVE it
# so the edge accepts RS256 only (a compromised edge can't forge tokens).
# JWT_PUBLIC_KEY = """
# -----BEGIN PUBLIC KEY-----
# <spki-base64-lines>
# -----END PUBLIC KEY-----
# """
# P2-1: edge rate-limit fail-mode when RATE_LIMIT_KV is bound but ERRORS.
# Leave unset/"false" to fail-OPEN (don't take the site down for a KV blip);
# set "true" to fail-CLOSED (block on KV error — stronger, but a KV outage can
# reject legitimate traffic). No effect when RATE_LIMIT_KV is simply unbound.
# RATE_LIMIT_FAIL_CLOSED = "false"

# P3-1: SPA script-src CSP mode. DEFAULT (unset) = "nonce": the edge swaps the
# build-time placeholder nonce ("xyz123") in served HTML for a fresh per-request
# nonce and emits a nonce-based Content-Security-Policy header WITHOUT
# 'unsafe-inline', so injected <script>s can't execute. Set "legacy" ONLY as an
# emergency rollback — it restores the old 'unsafe-inline' header and stops
# substituting the nonce (note: the SPA's baked <meta> CSP still enforces the
# nonce policy regardless, so "legacy" mirrors the pre-fix production behavior).
# CSP_MODE = "nonce"

# P3-5: defense-in-depth iss/aud enforcement on the EDGE admin gate. The edge
# already verifies the admin token's signature + role; these add an issuer +
# admin-audience check mirroring the origin's claim policy (claims are stamped
# by the origin's secret worker). Rollout order:
#   1) ship origin + edge in "monitor" (default) — mismatches are logged only
#   2) flip the ORIGIN to JWT_VERIFY_CLAIMS=enforce; wait the longest admin TTL
#      (branch-admin login = 8h) so every live token carries the claims
#   3) THEN set JWT_VERIFY_CLAIMS="enforce" here so the edge BLOCKS admin-route
#      tokens with a wrong/missing iss or aud.
# JWT_ISSUER / JWT_AUD_ADMIN must match the origin (defaults below).
# JWT_VERIFY_CLAIMS = "monitor"
# JWT_ISSUER = "magis-api"
# JWT_AUD_ADMIN = "magis-admin"

# P2-1: KV namespace for edge rate-limiting — ACTIVE (created 2026-07-12 via CF
# API; this repo deploys with deploy-api.mjs, which carries the same binding).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "cf4fbc55e27a44a0b2a867c4847a6e97"
