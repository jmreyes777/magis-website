version: "3.8"

# -----------------------------------------------------------------------------
# docker-compose.yaml - BASE (used by all stages)
# Run with stage override:
#   Dev:     docker compose up
#   Staging: docker compose -f docker-compose.yaml -f docker-compose.staging.yaml up
#   Prod:    docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up
# -----------------------------------------------------------------------------

services:
  node:
    build:
      context: .
    container_name: magis-node
    expose:
      - "5000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    command: ["node", "server.js"]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: magis-caddy
    ports:
      - "80:80"
      - "443:443/tcp"       # HTTP/1.1 + HTTP/2 (TLS over TCP)
      - "443:443/udp"       # HTTP/3 (QUIC over UDP) <-- required for HTTP/3
    volumes:
      - ./CaddyFile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - node
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: