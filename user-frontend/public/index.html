    <!-- Remove placeholder once React has mounted the real map -->
    <script nonce="xyz123">
      (function() {
        var done = false;
        function removePlaceholder() {
          if (done) return;
          var el = document.getElementById('map-static-placeholder');
          if (el) { el.remove(); done = true; }
        }
        // Remove after React mounts (map div appears in DOM)
        var observer = new MutationObserver(function() {
          if (document.getElementById('map')) { removePlaceholder(); observer.disconnect(); }
        });
        observer.observe(document.body, { childList: true, subtree: true });
        // Safety fallback
        window.addEventListener('load', function() { setTimeout(removePlaceholder, 3000); });
      })();
    </script>
