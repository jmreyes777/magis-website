# Dependabot: weekly dependency updates for every package in the monorepo.
# Grouped minor/patch to keep PR noise low; majors arrive individually so
# breaking changes are reviewed in isolation. Security updates always open
# immediately regardless of schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Manila
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /admin-frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Manila
    groups:
      admin-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /user-frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Manila
    groups:
      user-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /magis-edge-worker
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Manila
    groups:
      edge-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /tools/catalog-cutouts
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Manila
    groups:
      cutouts-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Manila
    open-pull-requests-limit: 3
