name: CodeQL

# Static analysis (SAST) for the whole JS monorepo: backend, both frontends,
# edge worker, tools. Runs on pushes/PRs to main plus a weekly sweep so newly
# published CodeQL queries re-scan unchanged code.
#
# ARTIFACT MODE: this repo is private on a personal account, where GitHub's
# code-scanning upload (Advanced Security) is not available — `upload: never`
# below, or the analyze step fails with "Code scanning is not enabled".
# Findings are published as a SARIF artifact + a per-rule table in the run
# summary instead. If the repo ever moves to an org with Advanced Security,
# delete `upload`/`output` and the two steps after analyze.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "user-frontend/public/catalog-cutouts/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "user-frontend/public/catalog-cutouts/**"
  schedule:
    - cron: "41 19 * * 0" # weekly, Sunday 19:41 UTC (Monday 03:41 PH)

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF results
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        # v4 (Node 24 runtime): v3 began failing when runners started forcing
        # Node 24 on node20-targeting actions; v3 is deprecated Dec 2026 anyway.
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          # security-extended adds lower-confidence but valuable queries;
          # findings land in the run summary + SARIF artifact (see header),
          # they never block deploys.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
          upload: never
          output: sarif-results

      - name: Findings summary (run summary tab)
        run: |
          {
            echo "## CodeQL findings"
            total=0
            for f in sarif-results/*.sarif; do
              n=$(jq '[.runs[].results[]] | length' "$f")
              total=$((total + n))
            done
            echo ""
            echo "**Total: ${total}**"
            if [ "$total" -gt 0 ]; then
              echo ""
              echo "| Count | Rule |"
              echo "| --- | --- |"
              jq -r '[.runs[].results[]] | group_by(.ruleId) | map({r: .[0].ruleId, n: length}) | sort_by(-.n) | .[] | "| \(.n) | \(.r) |"' sarif-results/*.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF artifact (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 30
