name: Security audit

# Weekly + on-push dependency audit for RUNTIME dependencies (--omit=dev)
# across every package, plus a CycloneDX SBOM artifact for the backend.
#
# Grace-period design (per SECURITY plan Phase 3): starts as WARN-ONLY so the
# check can be added to branch protection without blocking existing work;
# flip STRICT to "true" after the initial two-week triage window so NEW
# high/critical findings fail the check.
#
# ── Triage log (2026-08-09, SEC26 wave B — supersedes 2026-07-26) ─────────
# Backend runtime audit is CLEAN (firebase-admin v14 + scoped uuid overrides;
# nanoid/postcss/socket.io-parser audit-fixed). STRICT is now ON for every
# package except tools/catalog-cutouts (see matrix): its @imgly chain pins
# lodash, which has NO patched release for GHSA-r5fr-rjxr-66jc /
# GHSA-f23m-r3pf-42rh — accepted for an OFFLINE CI-only tool that never
# touches production traffic; revisit when @imgly or lodash publish fixes.
# What intentionally remains (unchanged from prior triage):
#   1. react-router GHSA-qwww-vcr4-c8h2 (admin-frontend, high): "RSC Mode CSRF
#      bypass" — vulnerable >=7.12.0 <8.3.0, fixed only in the v8 major. NOT
#      APPLICABLE: both SPAs use classic client-side BrowserRouter; no React
#      Server Components / server actions exist anywhere in this repo. Revisit
#      on the react-router v8 migration.
#   2. react-scripts@5 transitive chain (both frontends: jest/eslint/svgo/
#      webpack-dev-server/workbox/ejs/nth-check/postcss…): BUILD-TIME tooling
#      only — none of it ships in the browser bundle or runs on a server. CRA
#      is EOL upstream; npm's only "fix" is the nonsensical react-scripts@0.0.0
#      downgrade. Accepted until a Vite/CRACO migration; the runtime bundle is
#      what this workflow's --omit=dev audit is for.
#   3. serve@14 (both frontends, devDependencies): Playwright's local static
#      server for e2e only — never deployed (render.yaml serves prebuilt SPAs
#      via node/static hosting). Outside the --omit=dev gate already.
#   4. RESOLVED 2026-08-09: backend firebase-admin@13 moderates — upgraded to
#      v14; transitive uuid pinned via scoped overrides (gaxios/teeny-request).

on:
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "17 20 * * 0" # weekly, Sunday 20:17 UTC (Monday 04:17 PH)
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # SEC26 wave B (2026-08-09): triage window over — high/critical RUNTIME
  # findings now FAIL CI (per-dir opt-out lives in the matrix below).
  STRICT: "true"

jobs:
  npm-audit:
    name: npm audit (runtime deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - backend
          - admin-frontend
          - user-frontend
          - magis-edge-worker
          - tools/catalog-cutouts
        include:
          # Offline CI-only tool; lodash chain has no upstream patch (see
          # triage log). Warn-only until @imgly/lodash ship fixes.
          - dir: tools/catalog-cutouts
            warn_only: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Audit ${{ matrix.dir }}
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          set -o pipefail
          echo "── npm audit --omit=dev --audit-level=high ── ${{ matrix.dir }}"
          if npm audit --omit=dev --audit-level=high; then
            echo "✅ no high/critical runtime findings"
          else
            echo "⚠️ high/critical runtime findings above"
            if [ "$STRICT" = "true" ] && [ "${{ matrix.warn_only }}" != "true" ]; then
              exit 1
            else
              echo "(warn-only for this package — see triage log)"
            fi
          fi

  sbom:
    name: SBOM (backend, CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Generate CycloneDX SBOM
        working-directory: backend
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom-backend.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-backend
          path: backend/sbom-backend.cdx.json
          retention-days: 90
