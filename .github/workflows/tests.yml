# Testing megaplan TST0 — the test pyramid's CI gate.
#
# Four suites, all credential-free (no live Firestore/Redis/backend anywhere):
#   backend   node:test  — pure logic: TOTP, JWT pool, backup<->restore, cache
#             + route-level HTTP contracts against the real app (TST5)
#   frontend  Jest/RTL   — money math (pawn interest, layaway), components,
#                          content guardrails (guide/FAQ invariants)
#   admin     Jest/RTL   — session bootstrap, E2EE crypto roundtrips,
#                          claims quota-safety, ProtectedRoute, web-vitals
#                          shape guardrail (ADM waves)
#   e2e       Playwright — smoke of the PRODUCTION BUILD (prerendered HTML +
#                          hydration) with all /api/** calls mocked
#
# Enforcement model (user decision, 2026-07-18): we push straight to main, so
# this runs on every push; a failure pages Telegram (optional secrets, same
# pattern as post-deploy-verify.yml) and GitHub emails the committer.

name: Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "user-frontend/**"
      - "admin-frontend/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "user-frontend/**"
      - "admin-frontend/**"
      - ".github/workflows/tests.yml"
  # Failure drill: run from the Actions tab with force_fail=true to verify the
  # Telegram paging path end-to-end without touching any code.
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Force a failure to test Telegram paging"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Match local dev (Node 24): --test globs need >=21, and on 22 the
          # runner hung on stray async handles until the job timeout.
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Forced failure (Telegram paging drill)
        if: github.event.inputs.force_fail == 'true'
        run: |
          echo "::error::Deliberate failure — Telegram paging drill"
          exit 1
      - name: Backend logic tests (node:test)
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: user-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: user-frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit + component tests (Jest/RTL)
        run: npm run test:ci

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Admin unit + component tests (Jest/RTL)
        run: npx react-scripts test --watchAll=false
        env:
          CI: "true"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: user-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: user-frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build (production, same flags as Render)
        run: npm run build
        env:
          CI: "false" # CRA treats warnings as errors with CI=true; match Render
      - name: Install Playwright (Chromium only)
        run: npx playwright install chromium --with-deps
      - name: E2E smoke (built site, mocked API)
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: user-frontend/playwright-report/
          retention-days: 7

  # One paging step for the whole pyramid: fires if ANY suite failed — but
  # only for main-branch pushes and manual drills. PR failures (e.g. Dependabot
  # bumps that the gate correctly rejects) stay in the PR UI instead of paging.
  notify:
    runs-on: ubuntu-latest
    needs: [backend, frontend, admin, e2e]
    if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Telegram alert
        shell: bash
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "Telegram secrets not set — skipping (GitHub will still email the committer)."
            exit 0
          fi
          TEXT="🚨 Tests FAILED on ${GITHUB_REF_NAME} ($GITHUB_SHA)
          backend: ${{ needs.backend.result }} · frontend: ${{ needs.frontend.result }} · admin: ${{ needs.admin.result }} · e2e: ${{ needs.e2e.result }}
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -s --max-time 15 -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            --data "$(printf '{"chat_id":"%s","text":%s}' "$TG_CHAT" "$(printf '%s' "$TEXT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")" \
            || echo "::warning::Telegram send failed"
